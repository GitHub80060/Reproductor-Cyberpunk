name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno de Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x gradlew

      - name: Construir la aplicación (Generar APK)
        run: ./gradlew assembleDebug

      - name: Guardar y publicar el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: NeonDeck-APK
          path: app/build/outputs/apk/debug/app-debug.apk
