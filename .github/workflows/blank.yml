name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Esto te permite activarlo manualmente como lo hiciste antes

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Conceder permisos de ejecución a Gradle
      run: chmod +x gradlew

    - name: Compilar APK de Depuración (Debug)
      run: ./gradlew assembleDebug

    - name: Subir el APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: NeonDeck-APK
        path: app/build/outputs/apk/debug/app-debug.apk
