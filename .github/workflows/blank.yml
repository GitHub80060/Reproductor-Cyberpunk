name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Revisar que estén todos los archivos
        run: |
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml app/src/main/java/com/personal/neondeck/MainActivity.kt; do
            if [ ! -f "$f" ]; then
              echo "::error::Falta el archivo $f. Sube de nuevo el contenido del zip (la carpeta app y los archivos de la raiz)."
              exit 1
            fi
          done

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonDeck-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
